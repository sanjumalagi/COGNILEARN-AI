# CogniLearn AI — Docker Compose (Development)
# Reference: 01_Project_Foundation/05_Technology_Stack.md (Section 14)
# Reference: 08_DEPLOYMENT_AND_OPERATIONS/02_INFRASTRUCTURE_SETUP.md

services:
  db:
    image: postgres:16-alpine
    container_name: cognilearn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognilearn
      POSTGRES_PASSWORD: cognilearn
      POSTGRES_DB: cognilearn_ai
    ports:
      - "5432:5432"
    volumes:
      - cognilearn_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognilearn -d cognilearn_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cognilearn-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://cognilearn:cognilearn@db:5432/cognilearn_ai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: cognilearn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  cognilearn_db_data:
